<!doctype html>
<html lang="id">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg" />
        <meta name="theme-color" content="#C2410C" />
        <meta
            name="description"
            content="PelangganKu — Jangkau Ulang Setiap Pembeli. Database pelanggan TikTok Shop untuk seller Indonesia."
        />
        <!--
            Aplikasi ini berjalan sepenuhnya di komputer pengguna.
            Tidak ada skrip pihak ketiga, tidak ada pelacak, tidak ada
            perekam sesi. Data pembeli tidak pernah meninggalkan komputer ini.
            Font pun dibundel lokal supaya aplikasi tetap jalan tanpa internet.
        -->
        <title>PelangganKu — Jangkau Ulang Setiap Pembeli</title>
        <script>
            // Redam galat DataCloneError bawaan sebagian browser saat mengukur
            // performa — tidak berpengaruh ke jalannya aplikasi.
            window.addEventListener(
                "error",
                function (e) {
                    if (
                        e.error instanceof DOMException &&
                        e.error.name === "DataCloneError" &&
                        e.message &&
                        e.message.includes("PerformanceServerTiming")
                    ) {
                        e.stopImmediatePropagation();
                        e.preventDefault();
                    }
                },
                true
            );
        </script>
    </head>
    <body>
        <noscript>Aplikasi ini memerlukan JavaScript.</noscript>
        <div id="root"></div>
    </body>
</html>
